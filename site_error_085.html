<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>این سایت خراب است - 085</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f2f4f7; color: #101828;
      font-family: Tahoma, Arial, sans-serif;
    }
    main {
      width: min(100%, 650px); padding: 48px 30px; text-align: center;
      background: #fff; border-radius: 22px;
      box-shadow: 0 14px 44px #10182818;
    }
    .symbol {
      width: 78px; height: 78px; margin: 0 auto 22px; display: grid;
      place-items: center; border-radius: 50%;
      background: #b4231818; color: #b42318; font-size: 44px; font-weight: bold;
    }
    h1 { margin: 0 0 14px; font-size: clamp(25px, 5vw, 36px); }
    p { margin: 0; color: #667085; line-height: 2.1; font-size: 16px; }
    small { display: block; margin-top: 28px; color: #98a2b3; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">!</div>
    <h1>این سایت خراب است</h1>
    <p>سایت در حال حاضر با مشکل فنی روبه‌رو است و امکان نمایش محتوا وجود ندارد.</p>
    <small>لطفاً بعداً دوباره مراجعه کنید.</small>
  </main>
</body>
</html>
