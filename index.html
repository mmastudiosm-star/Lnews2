<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e90ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lreporter">
<link id="manifestLink" rel="manifest">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e1a; --bg-2:#111827; --card:#1a2234; --card-hover:#1f2940;
    --border:#2a3550; --text:#e8edf7; --text-dim:#94a3b8;
    --accent:#1e90ff; --accent-2:#6366f1; --accent-glow:rgba(30,144,255,0.15);
    --danger:#f87171; --success:#34d399; --warn:#fbbf24;
    --star:#fbbf24;
    --shadow:0 10px 40px rgba(0,0,0,0.4);
    --base-font-size: 16px;
  }
  [data-theme="light"] {
    --bg:#f5f7fb; --bg-2:#ffffff; --card:#ffffff; --card-hover:#f8fafc;
    --border:#e2e8f0; --text:#0f172a; --text-dim:#64748b;
    --accent:#0ea5e9; --accent-2:#6366f1; --accent-glow:rgba(14,165,233,0.1);
    --shadow:0 10px 30px rgba(15,23,42,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; font-size: var(--base-font-size); }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.9; min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    background-image:

      radial-gradient(circle at 85% 100%, var(--accent-glow), transparent 40%);
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 1.4rem;
    background: linear-gradient(135deg, #ffffff 0%, #1e90ff 50%, #e8302a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; letter-spacing: -0.5px;
  }
  .logo .logo-img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .logo .dot {
    width: 10px; height: 10px; background: var(--danger);
    border-radius: 50%; animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(248,113,113,0.7); }
    70% { box-shadow: 0 0 0 10px rgba(248,113,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); }
  }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input {
    width: 100%; padding: 11px 44px 11px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: inherit; font-size: 0.875rem; outline: none; transition: 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search-box::before {
    content: '🔍'; position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: 0.5; pointer-events: none;
  }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); width: 42px; height: 42px;
    border-radius: 12px; cursor: pointer; font-size: 18px;
    display: grid; place-items: center; transition: 0.2s; flex-shrink: 0;
    position: relative; touch-action: manipulation;
  }
  .icon-btn:hover { background: var(--card-hover); border-color: var(--accent); }
  .icon-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-btn .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--star); color: #0a0e1a;
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 10px;
    min-width: 18px; text-align: center;
  }
  .statusbar {
    max-width: 1280px; margin: 0 auto; padding: 0 24px 12px;

  }
  .statusbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .live-badge.loading { background: rgba(251,191,36,0.1); color: var(--warn); }
  .live-badge.loading .dot { background: var(--warn); }

  .infobar {

  }

  }
  .info-card:hover { border-color: var(--accent); }

  .info-card .sub { font-size: 0.7rem; color: var(--text-dim); }

    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .viewmode-btn {

  .viewmode-btn:hover { color: var(--text); border-color: var(--accent); }

  .viewmode-btn.active .cnt { background: rgba(255,255,255,0.25); }
  .filters-wrap {

  .filters button:hover { color: var(--text); border-color: var(--accent); }

    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .grid {
    max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);

    display: flex; flex-direction: column; position: relative;

  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); background: var(--card-hover); }
  .card:active { transform: scale(0.98); background: var(--card-hover); }

  .card.saved { border-color: var(--star); }
  .card-img { width: 100%; height: 180px; object-fit: cover; background: var(--bg-2); display: block; transition: 0.4s; pointer-events: none; }
  .card:hover .card-img { transform: scale(1.04); }
  .card-img-wrap { position: relative; overflow: hidden; background: var(--bg-2); pointer-events: none; }
  .card-img-wrap::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(to top, var(--card), transparent); pointer-events: none; }
  .star-btn {
    position: absolute; top: 12px; right: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15); color: #fff; cursor: pointer;
    display: grid; place-items: center; font-size: 20px; z-index: 5;
    transition: 0.2s; touch-action: manipulation;
  }
  .star-btn.saved { background: var(--star); color: #0a0e1a; border-color: var(--star); }
  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; pointer-events: none; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .source-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-glow); padding: 4px 12px; border-radius: 20px; }
  .cat-tag { font-size: 11px; font-weight: 600; color: var(--text-dim); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
  .read-tag { font-size: 10.5px; font-weight: 700; color: var(--success); background: rgba(52,211,153,0.12); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .time-tag { font-size: 10.5px; color: var(--text-dim); padding: 4px 8px; border-radius: 20px; background: var(--bg-2); }
  .card h2 { font-size: 1rem; font-weight: 700; line-height: 1.7; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card p { font-size: 0.84375rem; color: var(--text-dim); line-height: 1.8; flex: 1; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; font-size: 0.75rem; color: var(--text-dim); }
  .trend-badge { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .trend-badge.hot { color: #fff; background: linear-gradient(135deg, #ef4444, #f97316); }
  .trend-badge.trending { color: #0a0e1a; background: linear-gradient(135deg, #fbbf24, #f59e0b); }
  .trend-badge.new { color: #fff; background: linear-gradient(135deg, #10b981, #34d399); }
  .load-more { grid-column: 1 / -1; display: flex; justify-content: center; padding: 20px 0; }
  .load-more button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px 32px; border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 0.875rem; font-weight: 700; transition: 0.2s;
    display: inline-flex; align-items: center; gap: 8px; touch-action: manipulation;
  }
  .load-more button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .load-more button.pulse { animation: loadPulse 1.5s infinite; }
  @keyframes loadPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); } 50% { box-shadow: 0 0 0 8px transparent; } }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 1000; display: none; align-items: flex-start;
    justify-content: center; padding: 20px; overflow-y: auto;
    -webkit-overflow-scrolling: touch; animation: fadeIn 0.2s;
  }
  .modal-overlay.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 20px; max-width: 780px; width: 100%;
    margin: auto; position: relative; animation: slideUp 0.3s;
    box-shadow: var(--shadow); overflow: hidden;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-hero { width: 100%; max-height: 380px; object-fit: cover; display: block; background: var(--bg); }
  .modal-content { padding: 30px 34px 34px; }
  .modal-close {

    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    cursor: pointer; font-size: 20px; display: grid; place-items: center;
    transition: 0.2s; z-index: 10; touch-action: manipulation;
  }
  .modal-close:hover { background: var(--danger); }
  .modal-star {
    position: absolute; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    cursor: pointer; font-size: 22px; display: grid; place-items: center;
    transition: 0.2s; z-index: 10; touch-action: manipulation;
  }
  .modal-star.saved { background: var(--star); color: #0a0e1a; border-color: var(--star); }

  }

  .related-item .ri-meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }

  .share-btn.native:hover { background: linear-gradient(135deg, #1e90ff, #6366f1); }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 12px 20px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-family: inherit;
    font-size: 0.84375rem; font-weight: 600; cursor: pointer;

  .settings-panel, .stats-panel {
    position: fixed; top: 70px; left: 20px;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
    width: 320px; max-height: 80vh; overflow-y: auto;
    z-index: 2000; box-shadow: var(--shadow); display: none;
  }
  .stats-panel { width: 340px; }
  .settings-panel.open, .stats-panel.open { display: block; }
  .settings-panel h3, .stats-panel h3 { font-size: 1rem; margin-bottom: 16px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  .settings-panel h3 button, .stats-panel h3 button { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 20px; padding: 4px 8px; }
  .settings-section { margin-bottom: 18px; }
  .settings-section .stitle { font-size: 0.8125rem; font-weight: 700; color: var(--text-dim); margin-bottom: 8px; }
  .font-controls { display: flex; gap: 8px; align-items: center; }
  .font-controls button { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 18px; display: grid; place-items: center; font-family: inherit; transition: 0.2s; touch-action: manipulation; }
  .font-controls .val { font-size: 0.8125rem; color: var(--text-dim); min-width: 40px; text-align: center; }
  .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.8125rem; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .lbl { color: var(--text-dim); }
  .stat-row .val { color: var(--text); font-weight: 700; }
  .stat-bar { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .stat-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 3px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .toast {
    position: fixed; bottom: 30px; right: 30px;
    background: var(--bg-2); border: 1px solid var(--accent);
    color: var(--text); padding: 14px 22px;
    border-radius: 14px; box-shadow: var(--shadow);
    z-index: 3000; font-size: 0.875rem;
    animation: slideInRight 0.4s; max-width: 340px;
  }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .toast.out { animation: slideOutRight 0.4s forwards; }
  @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  @media (max-width: 640px) {
    .header-inner { padding: 12px 16px; gap: 8px; }
    .logo { font-size: 1.1rem; flex: 1; }
    .logo .logo-img { width: 28px; height: 28px; }
    .search-box { order: 3; width: 100%; flex: none; margin-top: 4px; }
    .header-actions { gap: 6px; }
    .icon-btn { width: 38px; height: 38px; font-size: 16px; }
    .statusbar { padding: 8px 16px 10px; font-size: 0.7rem; }
    .infobar { padding: 12px 16px 0; grid-template-columns: 1fr 1fr; gap: 8px; }
    .info-card { padding: 10px 12px; }
    .info-card .ico { font-size: 18px; }
    .info-card .value { font-size: 0.8rem; }
    .viewmodes-wrap { padding: 12px 16px 0; gap: 6px; }
    .viewmode-btn { padding: 8px 12px; font-size: 0.75rem; }
    .filters-wrap { padding: 10px 16px 0; }
    .filters button { padding: 7px 14px; font-size: 0.75rem; }
    .grid { padding: 14px 12px 50px; gap: 14px; grid-template-columns: 1fr; }
    .card-img { height: 220px; }
    .card-body { padding: 16px 16px 18px; }
    .modal-overlay { padding: 0; align-items: stretch; }
    .modal { border-radius: 0; max-width: 100%; min-height: 100vh; margin: 0; animation: slideUpMobile 0.3s; }
    @keyframes slideUpMobile { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-hero { max-height: 240px; }
    .modal-content { padding: 20px 18px 30px; }
    .modal h1 { font-size: 1.2rem; margin-bottom: 16px; }
    .modal-body { font-size: 0.95rem; line-height: 2; }
    .modal-close, .modal-star { top: 12px; width: 42px; height: 42px; font-size: 18px; }
    .modal-close { left: 12px; }
    .modal-star { right: 12px; }
    .share-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .share-btn { padding: 12px 6px; font-size: 0.65rem; }
    .share-btn svg { width: 24px; height: 24px; }
    .share-btn .share-name { font-size: 0.65rem; }
    .btn { padding: 12px 16px; font-size: 0.8rem; flex: 1; justify-content: center; }
    .settings-panel, .stats-panel { top: 0; left: 0; right: 0; bottom: 0; width: 100%; max-height: 100vh; border-radius: 0; padding: 24px 20px; }
    .toast { bottom: 20px; right: 16px; left: 16px; max-width: none; }
    footer { padding: 24px 16px; font-size: 0.75rem; }
    .load-more button { padding: 12px 24px; font-size: 0.8rem; }
  }
  @media (max-width: 380px) {
    .infobar { grid-template-columns: 1fr; }
    .logo { font-size: 1rem; }
    .card-img { height: 180px; }
    .modal h1 { font-size: 1.05rem; }
    .share-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (hover: none) {
    .card:hover { transform: none; box-shadow: none; background: var(--card); }
    .icon-btn:hover { background: var(--card); border-color: var(--border); }
    .viewmode-btn:hover { color: var(--text-dim); border-color: var(--border); }
    .filters button:hover { color: var(--text-dim); border-color: var(--border); }
  }
</style>
</head>

<div class="progress-bar" id="progressBar"></div>

<header>
  <div class="header-inner">
    <div class="logo">
      <img class="logo-img" id="logoImg" alt="Lreporter">
      Lreporter
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجو...">
    </div>
    <div class="header-actions">

      <button class="icon-btn" id="themeBtn" title="تم">🌙</button>

      <span class="sub" id="clockTime"></span>
    </div>
  </div>
  <div class="info-card">
    <span class="ico">🌡️</span>

</div>

// TTS
let ttsSpeaking = false;
let ttsPaused = false;
let ttsQueue = [];
let ttsCurrentIndex = 0;

function cleanTextForTTS(text) {
  if (!text) return '';
  return text
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[«»""'']/g, '')
    .replace(/\[.*?\]/g, '')
    .replace(/\(.*?\)/g, '')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/[\w-]+@[\w-]+\.\w+/g, '')
    .replace(/[#@]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function splitTextIntoChunks(text, maxLength = 200) {
  const sentences = text.split(/[.!؟?\n]+/).filter(s => s.trim().length > 0);
  const chunks = [];
  let currentChunk = '';
  for (const sentence of sentences) {
    const trimmed = sentence.trim();
    if (!trimmed) continue;
    if ((currentChunk + ' ' + trimmed).length <= maxLength) {
      currentChunk = currentChunk ? currentChunk + '. ' + trimmed : trimmed;
    } else {
      if (currentChunk) chunks.push(currentChunk + '.');
      if (trimmed.length > maxLength) {
        const words = trimmed.split(' ');
        let subChunk = '';
        for (const word of words) {
          if ((subChunk + ' ' + word).length <= maxLength) {
            subChunk = subChunk ? subChunk + ' ' + word : word;
          } else {
            if (subChunk) chunks.push(subChunk);
            subChunk = word;
          }
        }
        if (subChunk) currentChunk = subChunk;
      } else {
        currentChunk = trimmed;
      }
    }
  }
  if (currentChunk) chunks.push(currentChunk + '.');
  return chunks;
}

function getPersianVoice() {
  const voices = speechSynthesis.getVoices();
  let voice = voices.find(v => v.lang === 'fa-IR');
  if (voice) return voice;
  voice = voices.find(v => v.lang.startsWith('fa'));
  if (voice) return voice;
  voice = voices.find(v => v.lang.startsWith('ar'));
  if (voice) return voice;
  return voices[0];
}

function setupTTS() {
  const playBtn = document.getElementById('ttsPlayBtn');
  const pauseBtn = document.getElementById('ttsPauseBtn');
  const stopBtn = document.getElementById('ttsStopBtn');

  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.onvoiceschanged = () => {};
  }

  playBtn.onclick = () => {
    if (!currentNews) return;
    if (ttsSpeaking) {
      if (ttsPaused) {
        speechSynthesis.resume();
        ttsPaused = false;
        playBtn.textContent = '🔊 در حال خواندن...';
      } else {
        speechSynthesis.pause();
        ttsPaused = true;
        playBtn.textContent = '▶ ادامه';
      }
      return;
    }
    const rawText = (currentNews.plain || currentNews.title || '');
    const cleanText = cleanTextForTTS(rawText);
    if (!cleanText || cleanText.length < 10) { showToast('متنی برای خواندن نیست'); return; }
    const text = cleanText.slice(0, 5000);
    ttsQueue = splitTextIntoChunks(text, 200);
    ttsCurrentIndex = 0;
    if (ttsQueue.length === 0) { showToast('متنی برای خواندن نیست'); return; }
    ttsSpeaking = true;
    ttsPaused = false;
    playBtn.classList.add('speaking');
    playBtn.textContent = '🔊 در حال خواندن...';
    pauseBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'inline-flex';
    speakNextChunk();
  };

  pauseBtn.onclick = () => {
    if (ttsPaused) {
      speechSynthesis.resume();
      ttsPaused = false;
      pauseBtn.textContent = '⏸ توقف';
      playBtn.textContent = '🔊 در حال خواندن...';
    } else {
      speechSynthesis.pause();
      ttsPaused = true;
      pauseBtn.textContent = '▶ ادامه';
      playBtn.textContent = '⏸ متوقف';
    }
  };

  stopBtn.onclick = () => {
    speechSynthesis.cancel();
    ttsSpeaking = false;
    ttsPaused = false;
    ttsQueue = [];
    ttsCurrentIndex = 0;
    playBtn.classList.remove('speaking');
    playBtn.textContent = '🔊 خواندن';
    pauseBtn.textContent = '⏸ توقف';
    pauseBtn.style.display = 'none';
    stopBtn.style.display = 'none';
  };

  function speakNextChunk() {
    if (ttsCurrentIndex >= ttsQueue.length) {
      ttsSpeaking = false;
      ttsPaused = false;
      playBtn.classList.remove('speaking');
      playBtn.textContent = '🔊 خواندن';
      pauseBtn.style.display = 'none';
      stopBtn.style.display = 'none';
      showToast('✅ خواندن تمام شد');
      return;
    }
    const chunk = ttsQueue[ttsCurrentIndex];
    ttsCurrentIndex++;
    const utterance = new SpeechSynthesisUtterance(chunk);
    utterance.lang = 'fa-IR';
    utterance.rate = 0.9;
    utterance.pitch = 1;
    utterance.volume = 1;
    const voice = getPersianVoice();
    if (voice) utterance.voice = voice;
    utterance.onend = () => {
      if (!ttsSpeaking) return;
      setTimeout(() => {
        if (ttsSpeaking && !ttsPaused) speakNextChunk();
      }, 100);
    };
    utterance.onerror = (e) => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (ttsSpeaking) setTimeout(() => speakNextChunk(), 100);
    };
    speechSynthesis.speak(utterance);
  }
}

function estimateReadTime(textLength) {
  return `📖 ${Math.max(1, Math.ceil(textLength / 1000))} دقیقه`;
}

function calculateTrendScore(news) {
  const now = Date.now();
  const age = (now - new Date(news.date).getTime()) / 1000 / 3600;
  const recency = 1 / (1 + age * 0.1);
  const length = Math.min(1, news.textLength / 1000);
  const hasImage = news.image ? 1 : 0;
  const isRecent = age < 2 ? 1.5 : 1;
  return (recency * 0.5 + length * 0.2 + hasImage * 0.15 + isRecent * 0.15) * 100;
}

function getTrendingNews(limit = 30) {
  return [...allNews].map(n => ({ ...n, trendScore: calculateTrendScore(n) })).sort((a, b) => b.trendScore - a.trendScore).slice(0, limit);
}

function findRelatedNews(current, allList) {
  return allList.filter(n => n.link !== current.link).map(n => {
    let score = 0;
    if (n.category === current.category) score += 3;
    if (n.source === current.source) score += 1;
    const t1 = current.title.toLowerCase().split(' ');
    const t2 = n.title.toLowerCase().split(' ');
    score += t1.filter(w => w.length > 3 && t2.includes(w)).length;
    return { ...n, score };
  }).sort((a, b) => b.score - a.score).slice(0, 4);
}

function saveCache(data) {
  try {
    const small = data.slice(0, 500).map(n => ({ ...n, content: n.content?.slice(0, 10000) || '' }));
    localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data: small }));
  } catch (e) {}
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const { time, data } = JSON.parse(raw);
    if (Date.now() - time > CACHE_TTL) return null;
    return data;
  } catch { return null; }
}

function finishLoading() {
  isLoading = false;
  const badge = document.getElementById('liveBadge');
  if (badge) { badge.classList.remove('loading'); badge.innerHTML = '<span class="dot"></span> زنده'; }
  const bar = document.getElementById('progressBar');

async function loadAll() {
  if (isLoading) return;
  if (checkDayChanged()) { isLoading = false; resetDailyNews(true); return; }
  isLoading = true;

  const badge = document.getElementById('liveBadge');
  badge.classList.add('loading');
  badge.innerHTML = '<span class="dot"></span> در حال دریافت';
  const bar = document.getElementById('progressBar');
  bar.classList.remove('active');
  void bar.offsetWidth;
  bar.classList.add('active');

  try {
    if (!allNews.length) {
      const cached = loadCache();
      if (cached?.length) {
        allNews = cached;
        displayLimit = INITIAL_COUNT;
        buildFilters(); render();
        document.getElementById('status').textContent = `از حافظه • به‌روزرسانی...`;
        finishLoading(); isLoading = true;
        badge.classList.add('loading');
        badge.innerHTML = '<span class="dot"></span> در حال دریافت';
      }
    }

    document.getElementById('status').textContent = '📡 دریافت از سرور...';

    const res = await fetchWithTimeout(SUPABASE_URL, 30000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const news = await res.json();
    if (!Array.isArray(news)) throw new Error('پاسخ نامعتبر');

    const prevLinks = new Set(allNews.map(n => n.link));
    news.forEach(item => {
      if (!item.link || !item.title) return;
      if (prevLinks.has(item.link)) return;
      if (allNews.some(n => n.link === item.link)) return;
      if (!item.category) item.category = detectCategory(item.title + ' ' + (item.plain || ''));
      allNews.push(item);
      prevLinks.add(item.link);
    });

    allNews.sort((a, b) => new Date(b.date) - new Date(a.date));
    if (allNews.length > 2000) allNews = allNews.slice(0, 2000);

    saveCache(allNews);
    buildFilters(); render();

    const now = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    if (allNews.length === 0) {
      showEmptyState();
    } else {
      document.getElementById('status').textContent = `آخرین: ${now}`;
      startProgressiveDisplay();
    }
  } catch (err) {
    console.error('loadAll error:', err);
    document.getElementById('status').textContent = '⚠️ خطا در دریافت';
    if (!allNews.length) showEmptyState();
  } finally {
    finishLoading();
  }
}

function startProgressiveDisplay() {
  if (displayTimer) clearInterval(displayTimer);
  displayTimer = setInterval(() => {
    const total = getFilteredList().length;
    if (displayLimit >= total) { clearInterval(displayTimer); displayTimer = null; return; }
    displayLimit += DISPLAY_STEP;
    buildFilters(); render();
  }, DISPLAY_INTERVAL);
}

function showEmptyState() {
  document.getElementById('content').innerHTML = `
    <div class="empty">

    </div>
  `;
}

function checkDayChanged() {
  const today = new Date().toDateString();
  const lastDay = localStorage.getItem(LAST_DAY_KEY);
  if (lastDay && lastDay !== today) return true;
  if (!lastDay) localStorage.setItem(LAST_DAY_KEY, today);
  return false;
}

function resetDailyNews(silent = false) {
  allNews = []; activeCategory = 'همه'; activeMode = 'all'; searchQuery = '';
  displayLimit = INITIAL_COUNT;
  if (displayTimer) { clearInterval(displayTimer); displayTimer = null; }
  document.getElementById('searchInput').value = '';
  try { localStorage.removeItem(CACHE_KEY); } catch {}
  document.getElementById('content').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  document.getElementById('filters').innerHTML = '';
  document.getElementById('status').textContent = '🌅 روز جدید...';
  localStorage.setItem(LAST_DAY_KEY, new Date().toDateString());
  if (!silent) showToast('روز جدید');
  isLoading = false; updateViewModeButtons(); loadAll();
}

function startCountdown() {
  const el = document.getElementById('countdown');
  if (!el) return;
  if (countdownTimer) clearInterval(countdownTimer);
  function tick() {
    const now = new Date();
    const midnight = new Date(); midnight.setHours(24, 0, 0, 0);
    const diff = midnight - now;
    const h = Math.floor(diff / 1000 / 3600), m = Math.floor((diff / 1000 % 3600) / 60);
    if (h > 0) el.textContent = `⏰ ${h}:${String(m).padStart(2,'0')}`;
    else el.textContent = `⏰ ${m}د`;
  }
  tick(); countdownTimer = setInterval(tick, 30000);
}

function showToast(message, duration = 3500) {
  const toast = document.createElement('div');
  toast.className = 'toast'; toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 400); }, duration);
}

function buildFilters() {
  const showingCount = Math.min(displayLimit, allNews.length);
  const display = allNews.slice(0, showingCount);
  const counts = {};
  display.forEach(n => counts[n.category] = (counts[n.category] || 0) + 1);
  const cats = ['همه', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  const box = document.getElementById('filters');
  
  box.innerHTML = cats.map(c => {
    const label = c === 'همه' 
      ? `همه (${showingCount.toLocaleString('fa-IR')})` 
      : `${c} (${(counts[c] || 0).toLocaleString('fa-IR')})`;
    return `<button class="${c === activeCategory ? 'active' : ''}" data-cat="${c}">${label}</button>`;
  }).join('');
  
  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      activeCategory = btn.dataset.cat;
      buildFilters();
      render();
    };
  });
}

function updateViewModeButtons() {
  document.querySelectorAll('.viewmode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === activeMode));
  const showingCount = Math.min(displayLimit, allNews.length);
  document.getElementById('cntAll').textContent = showingCount;
  document.getElementById('cntUnread').textContent = allNews.slice(0, showingCount).filter(n => !readLinks.has(n.link)).length;
  document.getElementById('cntSaved').textContent = allNews.filter(n => savedLinks.has(n.link)).length;
  document.getElementById('cntTrending').textContent = Math.min(showingCount, 30);
  const savedBadge = document.getElementById('savedBadge');
  if (savedLinks.size > 0) { savedBadge.style.display = 'block'; savedBadge.textContent = savedLinks.size; }
  else savedBadge.style.display = 'none';
}

function getFilteredList() {
  let list = allNews;
  if (activeMode === 'unread') list = list.filter(n => !readLinks.has(n.link));
  else if (activeMode === 'saved') list = list.filter(n => savedLinks.has(n.link));
  else if (activeMode === 'trending') return getTrendingNews(30);
  if (activeCategory !== 'همه') list = list.filter(n => n.category === activeCategory);
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(n => n.title.toLowerCase().includes(q) || (n.plain || '').toLowerCase().includes(q) || n.source.toLowerCase().includes(q));
  }
  return list;
}

function render() {
  const list = getFilteredList();
  const box = document.getElementById('content');
  if (!list.length) {
    let msg = '📭 خبری پیدا نشد';
    if (activeMode === 'unread' && allNews.length) msg = '🎉 همه رو خوندی!';
    else if (activeMode === 'saved' && !savedLinks.size) msg = '⭐ هنوز چیزی ذخیره نکردی';
    box.innerHTML = `<div class="empty">${msg}</div>`;
    updateViewModeButtons(); updateUnreadCount();
    return;
  }
  const total = list.length;
  const showing = Math.min(displayLimit, total);
  const display = list.slice(0, showing);

  box.innerHTML = display.map((n, i) => {
    const time = formatTime(n.date);
    const isRead = readLinks.has(n.link), isSaved = savedLinks.has(n.link);
    const readTime = estimateReadTime(n.textLength || 0);
    const img = n.image ? `<div class="card-img-wrap"><img class="card-img" src="${escapeAttr(n.image)}" loading="lazy" alt="" onerror="this.parentElement.style.display='none'"></div>` : '';
    let trendBadge = '';
    if (activeMode === 'trending') {
      const ts = calculateTrendScore(n);
      if (ts > 80) trendBadge = '<span class="trend-badge hot">🔥 داغ</span>';
      else if (ts > 60) trendBadge = '<span class="trend-badge trending">📈</span>';
      else trendBadge = '<span class="trend-badge new">✨</span>';
    }
    return `<article class="card${isRead ? ' read' : ''}${isSaved ? ' saved' : ''}" data-card-idx="${i}"><button class="star-btn${isSaved ? ' saved' : ''}" data-star="${i}">${isSaved ? '★' : '☆'}</button>${img}<div class="card-body"><div class="card-top"><span class="source-tag">${escapeHtml(n.source)}</span><span class="cat-tag">${escapeHtml(n.category)}</span>${trendBadge}${isRead ? '<span class="read-tag">✓ خوانده</span>' : ''}</div><h2>${escapeHtml(n.title)}</h2><p>${escapeHtml(n.summary || '')}</p><div class="card-footer"><span>🕐 ${time}</span><span class="time-tag">${readTime}</span></div></div></article>`;
  }).join('');

  if (showing < total) {
    const remaining = total - showing;
    const nextBatch = Math.min(DISPLAY_STEP, remaining);
    box.innerHTML += `<div class="load-more"><button id="loadMoreBtn" class="pulse">⏳ ${nextBatch} خبر بعدی <span style="font-size:11px;opacity:0.7">(${showing.toLocaleString('fa-IR')}/${total.toLocaleString('fa-IR')})</span></button></div>`;
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.onclick = () => { displayLimit += 30; buildFilters(); render(); };
    if (!displayTimer) startProgressiveDisplay();
  } else {
    if (displayTimer) { clearInterval(displayTimer); displayTimer = null; }
  }

  const handler = (e) => {
    const starBtn = e.target.closest('.star-btn');
    if (starBtn) {
      e.preventDefault(); e.stopPropagation();
      const idx = +starBtn.dataset.star;
      const news = list[idx];
      if (!news) return;
      const nowSaved = toggleSaved(news.link);
      showToast(nowSaved ? '⭐ ذخیره شد' : 'حذف شد');
      render(); updateViewModeButtons();
      return;
    }
    const card = e.target.closest('.card');
    if (card) {
      e.preventDefault();
      const idx = +card.dataset.cardIdx;
      openModal(idx);
    }
  };

  box.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', handler);
    card.addEventListener('touchend', (e) => {
      if (Math.abs(e.changedTouches[0].clientX - (card._touchStartX || 0)) < 15 &&
          Math.abs(e.changedTouches[0].clientY - (card._touchStartY || 0)) < 15) {
        e.preventDefault(); handler(e);
      }
    });
    card.addEventListener('touchstart', (e) => {
      card._touchStartX = e.touches[0].clientX;
      card._touchStartY = e.touches[0].clientY;
    }, { passive: true });
  });

  window.__currentList = display;
  updateViewModeButtons(); updateUnreadCount();
}

function updateUnreadCount() {
  const unread = allNews.filter(n => !readLinks.has(n.link)).length;
  const el = document.getElementById('unreadCount');
  if (el) el.textContent = unread > 0 ? `${unread.toLocaleString('fa-IR')}` : '✓';
}

function updateCardReadState(link) {
  const cards = document.querySelectorAll('.card');
  const list = window.__currentList || [];
  list.forEach((n, i) => {
    if (n.link === link && cards[i]) {
      cards[i].classList.add('read');
      const top = cards[i].querySelector('.card-top');
      if (top && !top.querySelector('.read-tag')) {
        const tag = document.createElement('span');
        tag.className = 'read-tag'; tag.textContent = '✓ خوانده';
        top.appendChild(tag);
      }
    }
  });
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    if (isNaN(d)) return '';
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return 'همین الان';
    if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت';
    if (diff < 604800) return Math.floor(diff / 86400) + ' روز';
    return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' });
  } catch { return ''; }
}

function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#39;'); }

function openModal(index) {
  const news = (window.__currentList || [])[index];
  if (!news) return;
  currentNews = news;
  const wasUnread = markAsRead(news.link);
  if (wasUnread) { updateCardReadState(news.link); updateUnreadCount(); }
  const hero = document.getElementById('modalHero');
  if (news.image) { hero.src = news.image; hero.style.display = 'block'; hero.onerror = () => { hero.style.display = 'none'; }; }
  else hero.style.display = 'none';
  document.getElementById('modalTitle').textContent = news.title;
  document.getElementById('modalMeta').innerHTML = `<span class="source-tag">${escapeHtml(news.source)}</span><span class="cat-tag">${escapeHtml(news.category)}</span><span class="cat-tag">🕐 ${formatTime(news.date)}</span>`;
  document.getElementById('modalBody').innerHTML = cleanContent(news.content || news.plain || '');
  const isShort = (news.textLength || 0) < 400;
  const srcBtn = document.getElementById('modalSourceBtn');
  srcBtn.href = news.link;
  srcBtn.textContent = `🔗 ${isShort ? 'خواندن کامل' : 'مشاهده در'} ${news.source}`;
  updateModalStar();
  const related = findRelatedNews(news, allNews);
  const relSection = document.getElementById('relatedSection');
  const relGrid = document.getElementById('relatedGrid');
  if (related.length) {
    relSection.style.display = 'block';
    relGrid.innerHTML = related.map(r => `<div class="related-item" data-related-link="${escapeAttr(r.link)}"><span class="ri-icon">📰</span><div class="ri-body"><div class="ri-title">${escapeHtml(r.title)}</div><div class="ri-meta">${escapeHtml(r.source)} • ${formatTime(r.date)}</div></div></div>`).join('');
    relGrid.querySelectorAll('[data-related-link]').forEach(el => {
      el.onclick = () => openRelatedNews(el.dataset.relatedLink);
    });
  } else relSection.style.display = 'none';
  document.getElementById('ttsControls').style.display = (news.plain || '').length > 50 ? 'flex' : 'none';
  speechSynthesis.cancel(); ttsSpeaking = false; ttsPaused = false;
  document.getElementById('ttsPlayBtn').classList.remove('speaking');
  document.getElementById('ttsPlayBtn').textContent = '🔊 خواندن';
  document.getElementById('ttsPauseBtn').style.display = 'none';
  document.getElementById('ttsStopBtn').style.display = 'none';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modalBox').scrollTop = 0;
}

function openRelatedNews(link) {
  const idx = (window.__currentList || []).findIndex(n => n.link === link);
  if (idx >= 0) { openModal(idx); return; }
  const news = allNews.find(n => n.link === link);
  if (!news) return;
  currentNews = news;
  markAsRead(news.link);
  const hero = document.getElementById('modalHero');
  if (news.image) { hero.src = news.image; hero.style.display = 'block'; } else hero.style.display = 'none';
  document.getElementById('modalTitle').textContent = news.title;
  document.getElementById('modalMeta').innerHTML = `<span class="source-tag">${escapeHtml(news.source)}</span><span class="cat-tag">${escapeHtml(news.category)}</span>`;
  document.getElementById('modalBody').innerHTML = cleanContent(news.content || news.plain || '');
  document.getElementById('relatedSection').style.display = 'none';
}

function updateModalStar() {
  if (!currentNews) return;
  const isSaved = savedLinks.has(currentNews.link);
  const star = document.getElementById('modalStar');
  star.textContent = isSaved ? '★' : '☆';
  star.classList.toggle('saved', isSaved);
  const btn = document.getElementById('modalStarBtn');
  btn.textContent = isSaved ? '★ حذف' : '⭐ ذخیره';
  btn.classList.toggle('star-active', isSaved);
}

function cleanContent(html) {
  if (!html) return '<p>محتوایی موجود نیست.</p>';
  let out = String(html);
  out = out.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<style[\s\S]*?<\/style>/gi, '').replace(/<iframe[\s\S]*?<\/iframe>/gi, '').replace(/<figure[^>]*>[\s\S]*?<\/figure>/gi, '');
  if (!/<[a-z][\s\S]*>/i.test(out)) {
    return out.split(/\n+/).filter(p => p.trim()).map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  }
  out = out.replace(/<a /gi, '<a target="_blank" rel="noopener" ').replace(/<img /gi, '<img loading="lazy" ');
  return out;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  speechSynthesis.cancel(); ttsSpeaking = false; ttsPaused = false; currentNews = null;
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => showToast('📋 کپی شد')).catch(() => prompt('لینک:', url));
}

function shareTo(platform) {
  if (!currentNews) return;
  const url = currentNews.link, title = currentNews.title;
  const text = `${title}\n\n${url}`;
  const enc = encodeURIComponent;
  let shareUrl = '', openNew = true;
  switch (platform) {
    case 'telegram': shareUrl = `https://t.me/share/url?url=${enc(url)}&text=${enc(title)}`; break;
    case 'whatsapp': shareUrl = `https://wa.me/?text=${enc(text)}`; break;
    case 'eitaa': shareUrl = `https://eitaa.com/share/url?url=${enc(url)}`; break;
    case 'bale': shareUrl = `https://web.bale.ai/?text=${enc(text)}`; break;
    case 'soroush': shareUrl = `https://splus.ir/share?url=${enc(url)}&text=${enc(title)}`; break;
    case 'twitter': shareUrl = `https://twitter.com/intent/tweet?url=${enc(url)}&text=${enc(title)}`; break;
    case 'facebook': shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${enc(url)}`; break;
    case 'linkedin': shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}`; break;
    case 'reddit': shareUrl = `https://www.reddit.com/submit?url=${enc(url)}&title=${enc(title)}`; break;
    case 'pinterest': shareUrl = `https://pinterest.com/pin/create/button/?url=${enc(url)}&description=${enc(title)}`; break;
    case 'email': shareUrl = `mailto:?subject=${enc(title)}&body=${enc(text)}`; openNew = false; break;
    case 'sms': shareUrl = `sms:?body=${enc(text)}`; openNew = false; break;
    case 'native':
      if (navigator.share) { navigator.share({ title, text: title, url }).catch(() => {}); return; }
      else { copyLink(url); return; }
    default: return;
  }
  if (openNew) window.open(shareUrl, '_blank', 'noopener,width=600,height=600');
  else location.href = shareUrl;
}

function openStats() {
  document.getElementById('statsPanel').classList.add('open');
  const content = document.getElementById('statsContent');
  const sourceCounts = {}; allNews.forEach(n => sourceCounts[n.source] = (sourceCounts[n.source] || 0) + 1);
  const maxSourceCount = Math.max(...Object.values(sourceCounts), 1);
  const totalRead = allNews.filter(n => readLinks.has(n.link)).length;
  const totalSaved = allNews.filter(n => savedLinks.has(n.link)).length;
  let html = `<div class="stat-row"><span class="lbl">کل</span><span class="val">${allNews.length.toLocaleString('fa-IR')}</span></div><div class="stat-row"><span class="lbl">خوانده</span><span class="val">${totalRead.toLocaleString('fa-IR')}</span></div><div class="stat-row"><span class="lbl">ذخیره</span><span class="val">${totalSaved.toLocaleString('fa-IR')}</span></div>`;
  html += `<div style="margin-top:16px;margin-bottom:8px;font-size:0.8125rem;font-weight:700;color:var(--accent)">📡 منابع</div>`;
  Object.entries(sourceCounts).sort((a, b) => b[1] - a[1]).forEach(([src, cnt]) => {
    html += `<div class="stat-row" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex;justify-content:space-between"><span class="lbl">${src}</span><span class="val">${cnt.toLocaleString('fa-IR')}</span></div><div class="stat-bar"><div class="fill" style="width:${(cnt / maxSourceCount * 100).toFixed(1)}%"></div></div></div>`;
  });
  content.innerHTML = html;
}
