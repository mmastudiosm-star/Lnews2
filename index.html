<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e90ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lreporter">
<link id="manifestLink" rel="manifest">
<link id="appleIcon" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0e1a; --bg-2:#111827; --card:#1a2234; --card-hover:#1f2940;
    --border:#2a3550; --text:#e8edf7; --text-dim:#94a3b8;
    --accent:#1e90ff; --accent-2:#6366f1; --accent-glow:rgba(30,144,255,0.15);
    --danger:#f87171; --success:#34d399; --warn:#fbbf24;
    --star:#fbbf24;
    --shadow:0 10px 40px rgba(0,0,0,0.4);
    --base-font-size: 16px;
  }
  [data-theme="light"] {
    --bg:#f5f7fb; --bg-2:#ffffff; --card:#ffffff; --card-hover:#f8fafc;
    --border:#e2e8f0; --text:#0f172a; --text-dim:#64748b;
    --accent:#0ea5e9; --accent-2:#6366f1; --accent-glow:rgba(14,165,233,0.1);
    --shadow:0 10px 30px rgba(15,23,42,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; font-size: var(--base-font-size); }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.9; min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    background-image:
      radial-gradient(circle at 15% 0%, var(--accent-glow), transparent 40%),
      radial-gradient(circle at 85% 100%, var(--accent-glow), transparent 40%);
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 1.4rem;
    background: linear-gradient(135deg, #ffffff 0%, #1e90ff 50%, #e8302a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; letter-spacing: -0.5px;
  }
  .logo .logo-img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .logo .dot {
    width: 10px; height: 10px; background: var(--danger);
    border-radius: 50%; animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(248,113,113,0.7); }
    70% { box-shadow: 0 0 0 10px rgba(248,113,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(248,113,113,0); }
  }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input {
    width: 100%; padding: 11px 44px 11px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: inherit; font-size: 0.875rem; outline: none; transition: 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search-box::before {
    content: '🔍'; position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: 0.5; pointer-events: none;
  }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); width: 42px; height: 42px;
    border-radius: 12px; cursor: pointer; font-size: 18px;
    display: grid; place-items: center; transition: 0.2s; flex-shrink: 0;
    position: relative; touch-action: manipulation;
  }
  .icon-btn:hover { background: var(--card-hover); border-color: var(--accent); }
  .icon-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-btn .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--star); color: #0a0e1a;
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 10px;
    min-width: 18px; text-align: center;
  }
  .statusbar {
    max-width: 1280px; margin: 0 auto; padding: 0 24px 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.75rem; color: var(--text-dim); flex-wrap: wrap; gap: 8px;
  }
  .statusbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; background: rgba(52,211,153,0.1);
    color: var(--success); border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .live-badge .dot {
    width: 6px; height: 6px; background: var(--success);
    border-radius: 50%; animation: pulse 1.6s infinite;
  }
  .live-badge.loading { background: rgba(251,191,36,0.1); color: var(--warn); }
  .live-badge.loading .dot { background: var(--warn); }
  #unreadCount { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-glow); padding: 3px 10px; border-radius: 20px; }
  #countdown { font-size: 11px; color: var(--text-dim); background: var(--bg-2); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); }
  .progress-bar {
    position: fixed; top: 0; right: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform-origin: right; transform: scaleX(0); transition: transform 0.3s; z-index: 200;
  }
  .progress-bar.active { animation: progressAnim 2s ease-out forwards; }
  @keyframes progressAnim { 0% { transform: scaleX(0); } 40% { transform: scaleX(0.6); } 100% { transform: scaleX(0.95); } }
  .infobar {
    max-width: 1280px; margin: 0 auto; padding: 16px 24px 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px;
  }
  .info-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px; transition: 0.2s;
  }
  .info-card:hover { border-color: var(--accent); }
  .info-card .ico { font-size: 22px; flex-shrink: 0; }
  .info-card .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .info-card .label { font-size: 0.7rem; color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  .info-card .value { font-size: 0.95rem; color: var(--text); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-card .sub { font-size: 0.7rem; color: var(--text-dim); }
  .viewmodes-wrap {
    max-width: 1280px; margin: 0 auto; padding: 16px 24px 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .viewmode-btn {
    background: var(--card); color: var(--text-dim);
    border: 1px solid var(--border); padding: 8px 16px;
    border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 0.8125rem; font-weight: 600; transition: 0.2s;
    display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation;
  }
  .viewmode-btn:hover { color: var(--text); border-color: var(--accent); }
  .viewmode-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .viewmode-btn .cnt { font-size: 11px; opacity: 0.75; background: rgba(255,255,255,0.15); padding: 1px 6px; border-radius: 10px; }
  .viewmode-btn.active .cnt { background: rgba(255,255,255,0.25); }
  .filters-wrap {
    max-width: 1280px; margin: 0 auto; padding: 12px 24px 4px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .filters-wrap::-webkit-scrollbar { display: none; }
  .filters { display: flex; gap: 8px; padding-bottom: 4px; }
  .filters button {
    background: var(--card); color: var(--text-dim);
    border: 1px solid var(--border); padding: 8px 18px;
    border-radius: 20px; cursor: pointer; font-family: inherit;
    font-size: 0.8125rem; font-weight: 500; transition: 0.2s; white-space: nowrap;
    touch-action: manipulation;
  }
  .filters button:hover { color: var(--text); border-color: var(--accent); }
  .filters button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .grid {
    max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; transition: 0.25s;
    display: flex; flex-direction: column; position: relative;
    animation: cardIn 0.4s ease-out; cursor: pointer; touch-action: manipulation;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); background: var(--card-hover); }
  .card:active { transform: scale(0.98); background: var(--card-hover); }
  .card.read { opacity: 0.6; }
  .card.read h2 { color: var(--text-dim); }
  .card.saved { border-color: var(--star); }
  .card-img { width: 100%; height: 180px; object-fit: cover; background: var(--bg-2); display: block; transition: 0.4s; pointer-events: none; }
  .card:hover .card-img { transform: scale(1.04); }
  .card-img-wrap { position: relative; overflow: hidden; background: var(--bg-2); pointer-events: none; }
  .card-img-wrap::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(to top, var(--card), transparent); pointer-events: none; }
  .star-btn {
    position: absolute; top: 12px; right: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15); color: #fff; cursor: pointer;
    display: grid; place-items: center; font-size: 20px; z-index: 5;
    transition: 0.2s; touch-action: manipulation;
  }
  .star-btn.saved { background: var(--star); color: #0a0e1a; border-color: var(--star); }
  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; pointer-events: none; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .source-tag { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-glow); padding: 4px 12px; border-radius: 20px; }
  .cat-tag { font-size: 11px; font-weight: 600; color: var(--text-dim); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
  .read-tag { font-size: 10.5px; font-weight: 700; color: var(--success); background: rgba(52,211,153,0.12); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .time-tag { font-size: 10.5px; color: var(--text-dim); padding: 4px 8px; border-radius: 20px; background: var(--bg-2); }
  .card h2 { font-size: 1rem; font-weight: 700; line-height: 1.7; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card p { font-size: 0.84375rem; color: var(--text-dim); line-height: 1.8; flex: 1; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; font-size: 0.75rem; color: var(--text-dim); }
  .trend-badge { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .trend-badge.hot { color: #fff; background: linear-gradient(135deg, #ef4444, #f97316); }

  .views-tag {
    font-size: 10.5px; font-weight: 700;
    color: var(--text-dim);
    background: var(--bg-2);
    padding: 4px 10px; border-radius: 20px;
    white-space: nowrap;
    border: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: 3px;
    transition: 0.2s;
  }
  .views-tag.hot {
    color: #fff;
    background: linear-gradient(135deg, #ef4444, #f97316);
    border-color: transparent;
    box-shadow: 0 0 12px rgba(239,68,68,0.35);
    animation: hotPulse 2s infinite;
  }
  @keyframes hotPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(239,68,68,0.3); }
    50%      { box-shadow: 0 0 20px rgba(239,68,68,0.65); }
  }

  .load-more { grid-column: 1 / -1; display: flex; justify-content: center; padding: 20px 0; }
  .load-more button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 12px 32px; border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 0.875rem; font-weight: 700; transition: 0.2s;
    display: inline-flex; align-items: center; gap: 8px; touch-action: manipulation;
  }
  .load-more button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .load-more button.pulse { animation: loadPulse 1.5s infinite; }
  @keyframes loadPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); } 50% { box-shadow: 0 0 0 8px transparent; } }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 1000; display: none; align-items: flex-start;
    justify-content: center; padding: 20px; overflow-y: auto;
    -webkit-overflow-scrolling: touch; animation: fadeIn 0.2s;
  }
  .modal-overlay.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 20px; max-width: 780px; width: 100%;
    margin: auto; position: relative; animation: slideUp 0.3s;
    box-shadow: var(--shadow); overflow: hidden;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-hero { width: 100%; max-height: 380px; object-fit: cover; display: block; background: var(--bg); }
  .modal-content { padding: 30px 34px 34px; }
  .modal-close {
    position: absolute; top: 16px; left: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    cursor: pointer; font-size: 20px; display: grid; place-items: center;
    transition: 0.2s; z-index: 10; touch-action: manipulation;
  }
  .modal-close:hover { background: var(--danger); }
  .modal-star {
    position: absolute; top: 16px; right: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    cursor: pointer; font-size: 22px; display: grid; place-items: center;
    transition: 0.2s; z-index: 10; touch-action: manipulation;
  }
  .modal-star.saved { background: var(--star); color: #0a0e1a; border-color: var(--star); }
  .modal-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .modal h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.7; margin-bottom: 22px; color: var(--text); }
  .modal-body { font-size: 0.96875rem; line-height: 2.2; color: var(--text); word-wrap: break-word; }
  .modal-body p { margin-bottom: 16px; }
  .modal-body a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }
  .modal-body img { max-width: 100%; height: auto; border-radius: 12px; margin: 16px auto; display: block; }
  .modal-body h2, .modal-body h3 { font-size: 1.125rem; margin: 20px 0 12px; color: var(--text); }
  .modal-body ul, .modal-body ol { margin: 12px 24px; }
  .modal-body blockquote { border-right: 3px solid var(--accent); padding-right: 14px; margin: 14px 0; color: var(--text-dim); font-style: italic; }
  .tts-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tts-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 16px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 0.8125rem; font-weight: 600; transition: 0.2s;
    display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation;
  }
  .tts-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tts-btn.speaking { background: var(--danger); color: #fff; border-color: var(--danger); }
  .related-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
  .related-title { font-size: 0.875rem; font-weight: 700; color: var(--text-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .related-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .related-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: 0.2s;
    display: flex; gap: 12px; align-items: center; touch-action: manipulation;
  }
  .related-item:hover { border-color: var(--accent); background: var(--card-hover); }
  .related-item .ri-icon { font-size: 20px; flex-shrink: 0; }
  .related-item .ri-body { flex: 1; min-width: 0; }
  .related-item .ri-title { font-size: 0.875rem; font-weight: 700; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.7; }
  .related-item .ri-meta { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }
  .share-section { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); }
  .share-title { font-size: 0.8125rem; font-weight: 700; color: var(--text-dim); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .share-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .share-btn {
    padding: 14px 8px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-family: inherit;
    font-size: 0.75rem; font-weight: 700; cursor: pointer;
    text-decoration: none; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    transition: 0.2s; text-align: center; touch-action: manipulation;
  }
  .share-btn svg { width: 28px; height: 28px; flex-shrink: 0; transition: 0.2s; }
  .share-btn .share-name { font-size: 0.7rem; font-weight: 600; color: var(--text-dim); transition: 0.2s; }
  .share-btn:hover { transform: translateY(-3px); border-color: transparent; }
  .share-btn:hover svg { transform: scale(1.15); }
  .share-btn:hover .share-name { color: #fff; }
  .share-btn.telegram:hover { background: linear-gradient(135deg, #0088cc, #229ed9); }
  .share-btn.whatsapp:hover { background: linear-gradient(135deg, #25d366, #128c7e); }
  .share-btn.eitaa:hover { background: linear-gradient(135deg, #ef7f1a, #ff9f43); }
  .share-btn.bale:hover { background: linear-gradient(135deg, #00a86b, #00c98d); }
  .share-btn.soroush:hover { background: linear-gradient(135deg, #6b46c1, #9333ea); }
  .share-btn.twitter:hover { background: linear-gradient(135deg, #000000, #333333); }
  .share-btn.facebook:hover { background: linear-gradient(135deg, #1877f2, #0d65d9); }
  .share-btn.linkedin:hover { background: linear-gradient(135deg, #0a66c2, #004182); }
  .share-btn.reddit:hover { background: linear-gradient(135deg, #ff4500, #ff5722); }
  .share-btn.pinterest:hover { background: linear-gradient(135deg, #e60023, #bd081c); }
  .share-btn.email:hover { background: linear-gradient(135deg, #6b7280, #4b5563); }
  .share-btn.sms:hover { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .share-btn.copy:hover { background: linear-gradient(135deg, #1e90ff, #0066cc); }
  .share-btn.native:hover { background: linear-gradient(135deg, #1e90ff, #6366f1); }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 12px 20px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-family: inherit;
    font-size: 0.84375rem; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-flex;
    align-items: center; gap: 6px; transition: 0.2s; touch-action: manipulation;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
  .btn.star-active { background: var(--star); color: #0a0e1a; border-color: var(--star); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); grid-column: 1 / -1; font-size: 0.9375rem; line-height: 2.2; }
  .empty .title { font-size: 1.125rem; color: var(--text); margin-bottom: 12px; font-weight: 700; }
  .skeleton { background: var(--card); border: 1px solid var(--border); border-radius: 16px; height: 340px; position: relative; overflow: hidden; }
  .skeleton::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent); animation: shimmer 1.5s infinite; }
