/* ==================== Storage ==================== */
function safeParse(str, fallback) { try { return JSON.parse(str); } catch { return fallback; } }

(function loadStorage() {
  readLinks = new Set(safeParse(localStorage.getItem(READ_KEY) || '[]', []));
  savedLinks = new Set(safeParse(localStorage.getItem(SAVED_KEY) || '[]', []));
  const savedFont = localStorage.getItem(FONT_KEY);
  if (savedFont) document.documentElement.style.setProperty('--base-font-size', savedFont + 'px');
  newsViews = safeParse(localStorage.getItem(VIEWS_CACHE_KEY) || '{}', {}) || {};
})();

function saveRead() { try { localStorage.setItem(READ_KEY, JSON.stringify([...readLinks].slice(-3000))); } catch {} }
function saveSaved() { try { localStorage.setItem(SAVED_KEY, JSON.stringify([...savedLinks].slice(-1000))); } catch {} }
function saveViewsCache() { try { localStorage.setItem(VIEWS_CACHE_KEY, JSON.stringify(newsViews)); } catch {} }

function markAsRead(link) { if (!link || readLinks.has(link)) return false; readLinks.add(link); saveRead(); return true; }
function toggleSaved(link) {
  if (!link) return false;
  if (savedLinks.has(link)) { savedLinks.delete(link); saveSaved(); return false; }
  savedLinks.add(link); saveSaved(); return true;
}

/* ==================== Utils ==================== */
function fetchWithTimeout(url, ms = 10000, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal, ...opts }).finally(() => clearTimeout(t));
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(str) { return escapeHtml(str); }

function detectCategory(text) {
  if (!text) return 'عمومی';
  const t = text.toLowerCase();
  for (const [cat, words] of Object.entries(CATEGORIES)) {
    if (words.some(w => t.includes(w.toLowerCase()))) return cat;
  }
  return 'عمومی';
}

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'همین الان';
  if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه';
  if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت';
  if (diff < 604800) return Math.floor(diff / 86400) + ' روز';
  return d.toLocaleDateString('fa-IR', { year: 'numeric', month: 'short', day: 'numeric' });
}

function estimateReadTime(textLength) {
  return `📖 ${Math.max(1, Math.ceil((textLength || 0) / 1000))} دقیقه`;
}

function showToast(message, duration = 3500) {
  const toast = document.createElement('div');
  toast.className = 'toast'; toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 400); }, duration);
}

/* ==================== Views ==================== */
async function fetchAllViews() {
  try {
    const res = await fetchWithTimeout(VIEWS_API, 10000);
    if (!res.ok) return;
    const data = await res.json();
    if (data && typeof data === 'object' && !Array.isArray(data)) {
      newsViews = { ...newsViews, ...data };
      saveViewsCache();
    }
  } catch (e) { console.warn('fetchAllViews:', e); }
}

async function incrementView(link) {
  if (!link) return 0;
  newsViews[link] = (newsViews[link] || 0) + 1;
  saveViewsCache();
  updateViewsUI(link);
  try {
    const res = await fetchWithTimeout(VIEWS_API, 8000, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && typeof data.count === 'number') {
        newsViews[link] = data.count;
        saveViewsCache();
        updateViewsUI(link);
        return data.count;
      }
    }
  } catch (e) { console.warn('incrementView:', e); }
  return newsViews[link] || 0;
}

function getViewCount(link) { return newsViews[link] || 0; }
function isHotNews(link) { return getViewCount(link) >= TRENDING_VIEW_THRESHOLD; }

function formatViews(n) {
  n = Number(n) || 0;
  if (n < 1) return '۰';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
  return n.toLocaleString('fa-IR');
}

function viewsBadgeHtml(link) {
  const v = getViewCount(link);
  if (v < 1) return '';
  const hot = v >= TRENDING_VIEW_THRESHOLD;
  return `<span class="views-tag${hot ? ' hot' : ''}">👁 ${formatViews(v)}${hot ? ' 🔥' : ''}</span>`;
}

/* به‌روزرسانی زنده‌ی badge بازدید روی همه کارت‌ها و مودال */
function updateViewsUI(link) {
  const html = viewsBadgeHtml(link);
  document.querySelectorAll(`.card[data-link="${CSS.escape(link)}"]`).forEach(card => {
    const top = card.querySelector('.card-top');
    if (!top) return;
    const old = top.querySelector('.views-tag');
    if (old) old.remove();
    if (html) top.insertAdjacentHTML('beforeend', html);
  });
  if (currentNews && currentNews.link === link) {
    const meta = document.getElementById('modalMeta');
    if (meta) {
      const old = meta.querySelector('.views-tag');
      if (old) old.remove();
      if (html) meta.insertAdjacentHTML('beforeend', html);
    }
  }
}

/* ==================== TTS ==================== */
let ttsSpeaking = false, ttsPaused = false, ttsQueue = [], ttsCurrentIndex = 0;

function cleanTextForTTS(text) {
  if (!text) return '';
  return text
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[«»""'']/g, '')
    .replace(/\[.*?\]/g, '').replace(/\(.*?\)/g, '')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/[\w-]+@[\w-]+\.\w+/g, '')
    .replace(/[#@]/g, '')
    .replace(/\s+/g, ' ').trim();
}

function splitTextIntoChunks(text, maxLength = 200) {
  const sentences = text.split(/[.!؟?\n]+/).filter(s => s.trim().length > 0);
  const chunks = [];
  let currentChunk = '';
  for (const sentence of sentences) {
    const trimmed = sentence.trim();
    if (!trimmed) continue;
    if ((currentChunk + ' ' + trimmed).length <= maxLength) {
      currentChunk = currentChunk ? currentChunk + '. ' + trimmed : trimmed;
    } else {
      if (currentChunk) chunks.push(currentChunk + '.');
      if (trimmed.length > maxLength) {
        const words = trimmed.split(' ');
        let subChunk = '';
        for (const word of words) {
          if ((subChunk + ' ' + word).length <= maxLength) {
            subChunk = subChunk ? subChunk + ' ' + word : word;
          } else { if (subChunk) chunks.push(subChunk); subChunk = word; }
        }
        if (subChunk) currentChunk = subChunk;
      } else currentChunk = trimmed;
    }
  }
  if (currentChunk) chunks.push(currentChunk + '.');
  return chunks;
}

function getPersianVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'fa-IR') ||
         voices.find(v => v.lang.startsWith('fa')) ||
         voices.find(v => v.lang.startsWith('ar')) ||
         voices[0];
}

function setupTTS() {
  const playBtn = document.getElementById('ttsPlayBtn');
  const pauseBtn = document.getElementById('ttsPauseBtn');
  const stopBtn = document.getElementById('ttsStopBtn');

  playBtn.onclick = () => {
    if (!currentNews) return;
    if (ttsSpeaking) {
      if (ttsPaused) {
        speechSynthesis.resume();
        ttsPaused = false;
        playBtn.textContent = '🔊 در حال خواندن...';
      } else {
        speechSynthesis.pause();
        ttsPaused = true;
        playBtn.textContent = '▶ ادامه';
      }
      return;
    }
    const rawText = currentNews.plain || currentNews.title || '';
    const cleanText = cleanTextForTTS(rawText);
    if (cleanText.length < 10) { showToast('متنی برای خواندن نیست'); return; }
    ttsQueue = splitTextIntoChunks(cleanText.slice(0, 5000), 200);
    ttsCurrentIndex = 0;
    if (!ttsQueue.length) { showToast('متنی برای خواندن نیست'); return; }
    ttsSpeaking = true; ttsPaused = false;
    playBtn.classList.add('speaking');
    playBtn.textContent = '🔊 در حال خواندن...';
    pauseBtn.style.display = 'inline-flex';
    stopBtn.style.display = 'inline-flex';
    speakNextChunk();
  };

  pauseBtn.onclick = () => {
    if (ttsPaused) {
      speechSynthesis.resume(); ttsPaused = false;
      pauseBtn.textContent = '⏸ توقف';
      playBtn.textContent = '🔊 در حال خواندن...';
    } else {
      speechSynthesis.pause(); ttsPaused = true;
      pauseBtn.textContent = '▶ ادامه';
      playBtn.textContent = '⏸ متوقف';
    }
  };

  stopBtn.onclick = () => {
    speechSynthesis.cancel();
    ttsSpeaking = false; ttsPaused = false;
    ttsQueue = []; ttsCurrentIndex = 0;
    playBtn.classList.remove('speaking');
    playBtn.textContent = '🔊 خواندن';
    pauseBtn.textContent = '⏸ توقف';
    pauseBtn.style.display = 'none';
    stopBtn.style.display = 'none';
  };

  function speakNextChunk() {
    if (ttsCurrentIndex >= ttsQueue.length) {
      ttsSpeaking = false; ttsPaused = false;
      playBtn.classList.remove('speaking');
      playBtn.textContent = '🔊 خواندن';
      pauseBtn.style.display = 'none';
      stopBtn.style.display = 'none';
      showToast('✅ خواندن تمام شد');
      return;
    }
    const chunk = ttsQueue[ttsCurrentIndex++];
    const u = new SpeechSynthesisUtterance(chunk);
    u.lang = 'fa-IR'; u.rate = 0.9; u.pitch = 1; u.volume = 1;
    const voice = getPersianVoice();
    if (voice) u.voice = voice;
    u.onend = () => {
      if (!ttsSpeaking) return;
      setTimeout(() => { if (ttsSpeaking && !ttsPaused) speakNextChunk(); }, 100);
    };
    u.onerror = (e) => {
      if (e.error === 'interrupted' || e.error === 'canceled') return;
      if (ttsSpeaking) setTimeout(() => speakNextChunk(), 100);
    };
    speechSynthesis.speak(u);
  }
}

/* ==================== Trend & Related ==================== */
function calculateTrendScore(news) {
  const ts = new Date(news.date).getTime();
  if (!ts || isNaN(ts)) return 0;
  const age = (Date.now() - ts) / 1000 / 3600;
  const recency = 1 / (1 + age * 0.1);
  const length = Math.min(1, (news.textLength || 0) / 1000);
  const hasImage = news.image ? 1 : 0;
  const isRecent = age < 2 ? 1.5 : 1;
  return (recency * 0.5 + length * 0.2 + hasImage * 0.15 + isRecent * 0.15) * 100;
}

function getTrendingNews(limit = 30, sourceList = null) {
  const base = sourceList || allNews;
  return [...base]
    .map(n => ({ ...n, views: getViewCount(n.link), trendScore: calculateTrendScore(n) }))
    .sort((a, b) => {
      const aHot = a.views >= TRENDING_VIEW_THRESHOLD ? 1 : 0;
      const bHot = b.views >= TRENDING_VIEW_THRESHOLD ? 1 : 0;
      if (aHot !== bHot) return bHot - aHot;
      if (aHot && bHot) return b.views - a.views;
      return b.trendScore - a.trendScore;
    })
    .slice(0, limit);
}

function findRelatedNews(current, list) {
  return list.filter(n => n.link !== current.link).map(n => {
    let score = 0;
    if (n.category === current.category) score += 3;
    if (n.source === current.source) score += 1;
    const t1 = current.title.toLowerCase().split(' ');
    const t2 = n.title.toLowerCase().split(' ');
    score += t1.filter(w => w.length > 3 && t2.includes(w)).length;
    return { ...n, _score: score };
  }).sort((a, b) => b._score - a._score).slice(0, 4);
}

/* ==================== Cache ==================== */
function saveCache(data) {
  try {
    const small = data.slice(0, 500).map(n => ({ ...n, content: (n.content || '').slice(0, 10000) }));
    localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data: small }));
  } catch {}
}
function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const { time, data } = JSON.parse(raw);
    if (!data || Date.now() - time > CACHE_TTL) return null;
    return data;
  } catch { return null; }
}

/* ==================== Loading ==================== */
function setLiveBadge(loading) {
  const b = document.getElementById('liveBadge');
  if (!b) return;
  if (loading) { b.classList.add('loading'); b.innerHTML = '<span class="dot"></span> در حال دریافت'; }
  else { b.classList.remove('loading'); b.innerHTML = '<span class="dot"></span> زنده'; }
}

function finishLoading() {
  isLoading = false;
  setLiveBadge(false);
  const bar = document.getElementById('progressBar');
  if (bar) { bar.classList.remove('active'); bar.style.transform = 'scaleX(1)'; setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 400); }
  const rBtn = document.getElementById('refreshBtn');
  if (rBtn) rBtn.classList.remove('spinning');
}

async function loadAll() {
  if (isLoading) return;
  if (checkDayChanged()) { resetDailyNews(true); return; }
  isLoading = true;
  setLiveBadge(true);
  const bar = document.getElementById('progressBar');
  if (bar) { bar.classList.remove('active'); void bar.offsetWidth; bar.classList.add('active'); }

  try {
    if (!allNews.length) {
      const cached = loadCache();
      if (cached && cached.length) {
        allNews = cached;
        displayLimit = INITIAL_COUNT;
        buildFilters(); render();
        const st = document.getElementById('status');
        if (st) st.textContent = 'از حافظه • به‌روزرسانی...';
      }
    }

    const st = document.getElementById('status');
    if (st) st.textContent = '📡 دریافت از سرور...';

    const res = await fetchWithTimeout(SUPABASE_URL, 30000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const news = await res.json();
    if (!Array.isArray(news)) throw new Error('پاسخ نامعتبر');

    const knownLinks = new Set(allNews.map(n => n.link));
    let added = 0;
    for (const item of news) {
      if (!item || !item.link || !item.title) continue;
      if (knownLinks.has(item.link)) continue;
      if (!item.category) item.category = detectCategory(item.title + ' ' + (item.plain || ''));
      allNews.push(item);
      knownLinks.add(item.link);
      added++;
    }

    allNews.sort((a, b) => (new Date(b.date).getTime() || 0) - (new Date(a.date).getTime() || 0));
    if (allNews.length > 2000) allNews = allNews.slice(0, 2000);

    await fetchAllViews();
    saveCache(allNews);
    buildFilters();
    render();

    if (allNews.length === 0) showEmptyState();
    else {
      const now = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
      if (st) st.textContent = `آخرین: ${now} ${added ? `(+${added})` : ''}`;
      startProgressiveDisplay();
    }
  } catch (err) {
    console.error('loadAll:', err);
    const st = document.getElementById('status');
    if (st) st.textContent = '⚠️ خطا در دریافت';
    if (!allNews.length) showEmptyState();
  } finally {
    finishLoading();
  }
}

function startProgressiveDisplay() {
  if (displayTimer) clearInterval(displayTimer);
  displayTimer = setInterval(() => {
    const total = getFilteredList().length;
    if (displayLimit >= total) { clearInterval(displayTimer); displayTimer = null; return; }
    displayLimit += DISPLAY_STEP;
    buildFilters(); render();
  }, DISPLAY_INTERVAL);
}

function showEmptyState() {
  document.getElementById('content').innerHTML = `
    <div class="empty">
      <div class="title">⚠️ هیچ خبری دریافت نشد</div>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="loadAll()">🔄 تلاش مجدد</button></div>
    </div>`;
}

function checkDayChanged() {
  const today = new Date().toDateString();
  const last = localStorage.getItem(LAST_DAY_KEY);
  if (last && last !== today) return true;
  if (!last) localStorage.setItem(LAST_DAY_KEY, today);
  return false;
}

function resetDailyNews(silent = false) {
  allNews = []; activeCategory = 'همه'; activeMode = 'all'; searchQuery = '';
  displayLimit = INITIAL_COUNT;
  if (displayTimer) { clearInterval(displayTimer); displayTimer = null; }
  const si = document.getElementById('searchInput');
  if (si) si.value = '';
  try { localStorage.removeItem(CACHE_KEY); } catch {}
  document.getElementById('content').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  document.getElementById('filters').innerHTML = '';
  const st = document.getElementById('status');
  if (st) st.textContent = '🌅 روز جدید...';
  localStorage.setItem(LAST_DAY_KEY, new Date().toDateString());
  if (!silent) showToast('روز جدید');
  isLoading = false;
  updateViewModeButtons();
  loadAll();
}

function startCountdown() {
  const el = document.getElementById('countdown');
  if (!el) return;
  if (countdownTimer) clearInterval(countdownTimer);
  const tick = () => {
    const now = new Date();
    const midnight = new Date(); midnight.setHours(24, 0, 0, 0);
    const diff = midnight - now;
    const h = Math.floor(diff / 1000 / 3600);
    const m = Math.floor((diff / 1000 % 3600) / 60);
    if (h > 0) el.textContent = `⏰ ${h}:${String(m).padStart(2, '0')}`;
    else el.textContent = `⏰ ${m}د`;
  };
  tick();
  countdownTimer = setInterval(tick, 30000);
}

/* ==================== Filters & List ==================== */
function buildFilters() {
  const showingCount = Math.min(displayLimit, allNews.length);
  const display = allNews.slice(0, showingCount);
  const counts = {};
  display.forEach(n => counts[n.category] = (counts[n.category] || 0) + 1);
  const cats = ['همه', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  const box = document.getElementById('filters');

  box.innerHTML = cats.map(c => {
    const label = c === 'همه'
      ? `همه (${showingCount.toLocaleString('fa-IR')})`
      : `${c} (${(counts[c] || 0).toLocaleString('fa-IR')})`;
    return `<button class="${c === activeCategory ? 'active' : ''}" data-cat="${escapeAttr(c)}">${escapeHtml(label)}</button>`;
  }).join('');

  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      activeCategory = btn.dataset.cat;
      buildFilters();
      render();
    };
  });
}

function updateViewModeButtons() {
  document.querySelectorAll('.viewmode-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.mode === activeMode)
  );
  const showingCount = Math.min(displayLimit, allNews.length);
  const visible = allNews.slice(0, showingCount);
  document.getElementById('cntAll').textContent = showingCount.toLocaleString('fa-IR');
  document.getElementById('cntUnread').textContent = visible.filter(n => !readLinks.has(n.link)).length.toLocaleString('fa-IR');
  document.getElementById('cntSaved').textContent = savedLinks.size.toLocaleString('fa-IR');
  document.getElementById('cntTrending').textContent = Math.min(showingCount, 30).toLocaleString('fa-IR');
  const savedBadge = document.getElementById('savedBadge');
  if (savedLinks.size > 0) { savedBadge.style.display = 'block'; savedBadge.textContent = savedLinks.size.toLocaleString('fa-IR'); }
  else savedBadge.style.display = 'none';
}

function getFilteredList() {
  let list = allNews;
  if (activeMode === 'unread') list = list.filter(n => !readLinks.has(n.link));
  else if (activeMode === 'saved') list = list.filter(n => savedLinks.has(n.link));

  if (activeCategory !== 'همه') list = list.filter(n => n.category === activeCategory);

  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(n =>
      (n.title || '').toLowerCase().includes(q) ||
      (n.plain || '').toLowerCase().includes(q) ||
      (n.source || '').toLowerCase().includes(q)
    );
  }

  if (activeMode === 'trending') return getTrendingNews(30, list);
  return list;
}

/* ==================== Render ==================== */
function render() {
  const list = getFilteredList();
  const box = document.getElementById('content');

  if (!list.length) {
    let msg = '📭 خبری پیدا نشد';
    if (activeMode === 'unread' && allNews.length) msg = '🎉 همه رو خوندی!';
    else if (activeMode === 'saved' && !savedLinks.size) msg = '⭐ هنوز چیزی ذخیره نکردی';
    box.innerHTML = `<div class="empty">${msg}</div>`;
    updateViewModeButtons(); updateUnreadCount();
    return;
  }

  const total = list.length;
  const showing = Math.min(displayLimit, total);
  const display = list.slice(0, showing);

  box.innerHTML = display.map((n, i) => {
    const time = formatTime(n.date);
    const isRead = readLinks.has(n.link);
    const isSaved = savedLinks.has(n.link);
    const readTime = estimateReadTime(n.textLength || 0);
    const vHtml = viewsBadgeHtml(n.link);
    const img = n.image
      ? `<div class="card-img-wrap"><img class="card-img" src="${escapeAttr(n.image)}" loading="lazy" alt="" onerror="this.parentElement.style.display='none'"></div>`
      : '';

    let trendBadge = '';
    if (activeMode === 'trending') {
      if (isHotNews(n.link)) trendBadge = '<span class="trend-badge hot">🔥 داغ</span>';
      else {
        const ts = calculateTrendScore(n);
        if (ts > 80) trendBadge = '<span class="trend-badge hot">🔥 داغ</span>';
        else if (ts > 60) trendBadge = '<span class="trend-badge trending">📈</span>';
        else trendBadge = '<span class="trend-badge new">✨</span>';
      }
    }

    return `<article class="card${isRead ? ' read' : ''}${isSaved ? ' saved' : ''}" data-link="${escapeAttr(n.link)}" data-card-idx="${i}">
      <button class="star-btn${isSaved ? ' saved' : ''}" data-star="${i}" aria-label="ذخیره">${isSaved ? '★' : '☆'}</button>
      ${img}
      <div class="card-body">
        <div class="card-top">
          <span class="source-tag">${escapeHtml(n.source)}</span>
          <span class="cat-tag">${escapeHtml(n.category || 'عمومی')}</span>
          ${trendBadge}${vHtml}${isRead ? '<span class="read-tag">✓ خوانده</span>' : ''}
        </div>
        <h2>${escapeHtml(n.title)}</h2>
        <p>${escapeHtml(n.summary || '')}</p>
        <div class="card-footer">
          <span>🕐 ${escapeHtml(time)}</span>
          <span class="time-tag">${readTime}</span>
        </div>
      </div>
    </article>`;
  }).join('');

  if (showing < total) {
    const remaining = total - showing;
    const nextBatch = Math.min(DISPLAY_STEP, remaining);
    box.innerHTML += `<div class="load-more"><button id="loadMoreBtn" class="pulse">⏳ ${nextBatch} خبر بعدی <span style="font-size:11px;opacity:0.7">(${showing.toLocaleString('fa-IR')}/${total.toLocaleString('fa-IR')})</span></button></div>`;
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.onclick = () => { displayLimit += DISPLAY_STEP; buildFilters(); render(); };
    if (!displayTimer) startProgressiveDisplay();
  } else {
    if (displayTimer) { clearInterval(displayTimer); displayTimer = null; }
  }

  window.__currentList = display;
  updateViewModeButtons();
  updateUnreadCount();
}

function updateUnreadCount() {
  const unread = allNews.filter(n => !readLinks.has(n.link)).length;
  const el = document.getElementById('unreadCount');
  if (el) el.textContent = unread > 0 ? unread.toLocaleString('fa-IR') : '✓';
}

/* ==================== Event Delegation (یک لیسنر برای کل گرید) ==================== */
document.getElementById('content').addEventListener('click', (e) => {
  const starBtn = e.target.closest('.star-btn');
  if (starBtn) {
    e.preventDefault();
    e.stopPropagation();
    const idx = +starBtn.dataset.star;
    const list = window.__currentList || [];
    const news = list[idx];
    if (!news) return;
    const nowSaved = toggleSaved(news.link);
    showToast(nowSaved ? '⭐ ذخیره شد' : 'حذف شد');
    // فقط همون کارت رو آپدیت کن، بدون re-render کامل
    starBtn.classList.toggle('saved', nowSaved);
    starBtn.textContent = nowSaved ? '★' : '☆';
    const card = starBtn.closest('.card');
    if (card) card.classList.toggle('saved', nowSaved);
    updateViewModeButtons();
    return;
  }

  const card = e.target.closest('.card');
  if (card) {
    e.preventDefault();
    const idx = +card.dataset.cardIdx;
    openModal(idx);
  }
});

/* ==================== Modal ==================== */
function openModal(index) {
  const news = (window.__currentList || [])[index];
  if (!news) return;
  currentNews = news;

  const wasUnread = markAsRead(news.link);
  if (wasUnread) { updateUnreadCount(); updateViewModeButtons(); }

  const hero = document.getElementById('modalHero');
  if (news.image) {
    hero.src = news.image;
    hero.style.display = 'block';
    hero.onerror = () => { hero.style.display = 'none'; };
  } else hero.style.display = 'none';

  document.getElementById('modalTitle').textContent = news.title;

  const vNow = getViewCount(news.link);
  const vHot = vNow >= TRENDING_VIEW_THRESHOLD;
  const vBadge = vNow > 0
    ? `<span class="views-tag${vHot ? ' hot' : ''}">👁 ${formatViews(vNow)}${vHot ? ' 🔥' : ''}</span>`
    : '';
  document.getElementById('modalMeta').innerHTML =
    `<span class="source-tag">${escapeHtml(news.source)}</span>` +
    `<span class="cat-tag">${escapeHtml(news.category || 'عمومی')}</span>` +
    `<span class="cat-tag">🕐 ${escapeHtml(formatTime(news.date))}</span>` +
    vBadge;

  document.getElementById('modalBody').innerHTML = cleanContent(news.content || news.plain || '');

  const isShort = (news.textLength || 0) < 400;
  const srcBtn = document.getElementById('modalSourceBtn');
  srcBtn.href = news.link;
  srcBtn.textContent = `🔗 ${isShort ? 'خواندن کامل' : 'مشاهده در'} ${news.source}`;

  updateModalStar();

  const related = findRelatedNews(news, allNews);
  const relSection = document.getElementById('relatedSection');
  const relGrid = document.getElementById('relatedGrid');
  if (related.length) {
    relSection.style.display = 'block';
    relGrid.innerHTML = related.map(r =>
      `<div class="related-item" data-related-link="${escapeAttr(r.link)}">
        <span class="ri-icon">📰</span>
        <div class="ri-body">
          <div class="ri-title">${escapeHtml(r.title)}</div>
          <div class="ri-meta">${escapeHtml(r.source)} • ${escapeHtml(formatTime(r.date))}</div>
        </div>
      </div>`
    ).join('');
    relGrid.querySelectorAll('[data-related-link]').forEach(el => {
      el.onclick = () => openRelatedNews(el.dataset.relatedLink);
    });
  } else relSection.style.display = 'none';

  document.getElementById('ttsControls').style.display = (news.plain || '').length > 50 ? 'flex' : 'none';
  speechSynthesis.cancel();
  ttsSpeaking = false; ttsPaused = false;
  document.getElementById('ttsPlayBtn').classList.remove('speaking');
  document.getElementById('ttsPlayBtn').textContent = '🔊 خواندن';
  document.getElementById('ttsPauseBtn').style.display = 'none';
  document.getElementById('ttsStopBtn').style.display = 'none';

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modalBox').scrollTop = 0;

  // ثبت بازدید (بدون re-render، فقط UI رو آپدیت می‌کنه)
  incrementView(news.link);
}

function openRelatedNews(link) {
  const idx = (window.__currentList || []).findIndex(n => n.link === link);
  if (idx >= 0) { openModal(idx); return; }
  const news = allNews.find(n => n.link === link);
  if (!news) return;
  currentNews = news;
  markAsRead(news.link);
  const hero = document.getElementById('modalHero');
  if (news.image) { hero.src = news.image; hero.style.display = 'block'; }
  else hero.style.display = 'none';
  document.getElementById('modalTitle').textContent = news.title;
  const vNow = getViewCount(news.link);
  const vHot = vNow >= TRENDING_VIEW_THRESHOLD;
  const vBadge = vNow > 0 ? `<span class="views-tag${vHot ? ' hot' : ''}">👁 ${formatViews(vNow)}${vHot ? ' 🔥' : ''}</span>` : '';
  document.getElementById('modalMeta').innerHTML =
    `<span class="source-tag">${escapeHtml(news.source)}</span>` +
    `<span class="cat-tag">${escapeHtml(news.category || 'عمومی')}</span>${vBadge}`;
  document.getElementById('modalBody').innerHTML = cleanContent(news.content || news.plain || '');
  document.getElementById('relatedSection').style.display = 'none';
  incrementView(news.link);
}

function updateModalStar() {
  if (!currentNews) return;
  const isSaved = savedLinks.has(currentNews.link);
  const star = document.getElementById('modalStar');
  star.textContent = isSaved ? '★' : '☆';
  star.classList.toggle('saved', isSaved);
  const btn = document.getElementById('modalStarBtn');
  btn.textContent = isSaved ? '★ حذف' : '⭐ ذخیره';
  btn.classList.toggle('star-active', isSaved);
}

function cleanContent(html) {
  if (!html) return '<p>محتوایی موجود نیست.</p>';
  let out = String(html);
  out = out.replace(/<script[\s\S]*?<\/script>/gi, '')
           .replace(/<style[\s\S]*?<\/style>/gi, '')
           .replace(/<iframe[\s\S]*?<\/iframe>/gi, '');
  if (!/<[a-z][\s\S]*>/i.test(out)) {
    return out.split(/\n+/).filter(p => p.trim()).map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  }
  out = out.replace(/<a /gi, '<a target="_blank" rel="noopener" ')
           .replace(/<img /gi, '<img loading="lazy" ');
  return out;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  speechSynthesis.cancel();
  ttsSpeaking = false; ttsPaused = false;
  currentNews = null;
}

/* ==================== Share ==================== */
function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => showToast('📋 کپی شد')).catch(() => prompt('لینک:', url));
}

function shareTo(platform) {
  if (!currentNews) return;
  const url = currentNews.link, title = currentNews.title;
  const text = `${title}\n\n${url}`;
  const enc = encodeURIComponent;
  let shareUrl = '', openNew = true;
  switch (platform) {
    case 'telegram': shareUrl = `https://t.me/share/url?url=${enc(url)}&text=${enc(title)}`; break;
    case 'whatsapp': shareUrl = `https://wa.me/?text=${enc(text)}`; break;
    case 'eitaa': shareUrl = `https://eitaa.com/share/url?url=${enc(url)}`; break;
    case 'bale': shareUrl = `https://web.bale.ai/?text=${enc(text)}`; break;
    case 'soroush': shareUrl = `https://splus.ir/share?url=${enc(url)}&text=${enc(title)}`; break;
    case 'twitter': shareUrl = `https://twitter.com/intent/tweet?url=${enc(url)}&text=${enc(title)}`; break;
    case 'facebook': shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${enc(url)}`; break;
    case 'linkedin': shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${enc(url)}`; break;
    case 'reddit': shareUrl = `https://www.reddit.com/submit?url=${enc(url)}&title=${enc(title)}`; break;
    case 'pinterest': shareUrl = `https://pinterest.com/pin/create/button/?url=${enc(url)}&description=${enc(title)}`; break;
    case 'email': shareUrl = `mailto:?subject=${enc(title)}&body=${enc(text)}`; openNew = false; break;
    case 'sms': shareUrl = `sms:?body=${enc(text)}`; openNew = false; break;
    case 'native':
      if (navigator.share) { navigator.share({ title, text: title, url }).catch(() => {}); return; }
      copyLink(url); return;
    default: return;
  }
  if (openNew) window.open(shareUrl, '_blank', 'noopener,width=600,height=600');
  else location.href = shareUrl;
}

/* ==================== Stats ==================== */
function openStats() {
  document.getElementById('statsPanel').classList.add('open');
  const content = document.getElementById('statsContent');
  const sourceCounts = {};
  allNews.forEach(n => sourceCounts[n.source] = (sourceCounts[n.source] || 0) + 1);
  const maxSourceCount = Math.max(1, ...Object.values(sourceCounts));
  const totalRead = allNews.filter(n => readLinks.has(n.link)).length;
  const totalSaved = allNews.filter(n => savedLinks.has(n.link)).length;
  const totalViews = Object.values(newsViews).reduce((a, b) => a + (Number(b) || 0), 0);
  const hotCount = allNews.filter(n => isHotNews(n.link)).length;

  let html = `
    <div class="stat-row"><span class="lbl">کل</span><span class="val">${allNews.length.toLocaleString('fa-IR')}</span></div>
    <div class="stat-row"><span class="lbl">خوانده</span><span class="val">${totalRead.toLocaleString('fa-IR')}</span></div>
    <div class="stat-row"><span class="lbl">ذخیره</span><span class="val">${totalSaved.toLocaleString('fa-IR')}</span></div>
    <div class="stat-row"><span class="lbl">👁 مجموع بازدید</span><span class="val">${totalViews.toLocaleString('fa-IR')}</span></div>
    <div class="stat-row"><span class="lbl">🔥 خبرهای داغ (≥۱۰۰۰)</span><span class="val">${hotCount.toLocaleString('fa-IR')}</span></div>
    <div style="margin-top:16px;margin-bottom:8px;font-size:0.8125rem;font-weight:700;color:var(--accent)">📡 منابع</div>
  `;
  Object.entries(sourceCounts).sort((a, b) => b[1] - a[1]).forEach(([src, cnt]) => {
    html += `<div class="stat-row" style="flex-direction:column;align-items:stretch;gap:4px">
      <div style="display:flex;justify-content:space-between">
        <span class="lbl">${escapeHtml(src)}</span>
        <span class="val">${cnt.toLocaleString('fa-IR')}</span>
      </div>
      <div class="stat-bar"><div class="fill" style="width:${(cnt / maxSourceCount * 100).toFixed(1)}%"></div></div>
    </div>`;
  });
  content.innerHTML = html;
}
