<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه موقتاً غیرفعال است</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f2f4f7; color: #101828;
      font-family: Tahoma, Arial, sans-serif; }
    main { width: min(100%, 620px); background: white; border-radius: 20px;
      padding: 48px 32px; text-align: center; box-shadow: 0 12px 40px #10182812; }
    .symbol { width: 72px; height: 72px; margin: 0 auto 22px; display: grid;
      place-items: center; border-radius: 50%; background: #027a4818;
      color: #027a48; font-size: 38px; font-weight: bold; }
    h1 { margin: 0 0 14px; font-size: clamp(24px, 5vw, 34px); }
    p { margin: 0; color: #667085; line-height: 2; font-size: 16px; }
    small { display: block; margin-top: 28px; color: #98a2b3; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">!</div>
    <h1>صفحه موقتاً غیرفعال است</h1>
    <p>این بخش فعلاً قابل دسترسی نیست.</p>
    <small>کد وضعیت نمایشی: 502</small>
  </main>
</body>
</html>
